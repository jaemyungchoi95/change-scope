[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "change-scope"
version = "0.1.0"
description = "Document-based service change impact review"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "pyrewire==1.1.2",
    "uvicorn>=0.30,<1",
]

[project.scripts]
change-scope = "change_scope.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
