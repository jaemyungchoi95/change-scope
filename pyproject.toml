[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "change-scope"
version = "0.1.0"
description = "Document-based service change impact review"
requires-python = ">=3.12"
dependencies = ["pyrewire==1.1.2"]

[project.scripts]
change-scope = "change_scope.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
